{{- if .IsHome -}}
<title>{{ .Site.Title }}</title>
{{- else -}}
<title>{{ .Title }} · {{ .Site.Title }}</title>
{{- end -}}
{{ partial "social-meta.html" . }}

<link rel="stylesheet" href="{{ $style.RelPermalink }}" />

<script src="{{ $mobileMenu.RelPermalink }}"></script>
