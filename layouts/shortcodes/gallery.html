<!-- Gallery Shortcode -->
<section class="show-gallery">
  {{ .Inner | safeHTML }}
</section>

<!-- Lightbox (only included if not already on the page) -->
{{ if not (.Page.Scratch.Get "lightboxIncluded") }}
  {{ .Page.Scratch.Set "lightboxIncluded" true }}
  
  <div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="Lightbox image" onclick="event.stopPropagation()" />
  </div>

  {{ $lightbox := resources.Get "js/lightbox.js" }}
  {{ $lightbox = $lightbox | js.Build }}
  <script src="{{ $lightbox.RelPermalink }}"></script>
{{ end }}
