<!-- Gallery Shortcode -->
{{ if eq (.Get "sq") "true" }}
<section class="square-gallery">
{{ else }}
<section class="show-gallery">
{{ end }}
  {{ $content := .Inner }}
  {{ $images := split (trim $content "\n\r ") "\n" }}
  
  {{ range $images }}
    {{ $img := trim . " \n\r\t" }}
    {{ if ne $img "" }}
    <div class="gallery-item">
      <img src="{{ $img }}" alt="Gallery image" class="gallery-image" onclick="openLightbox('{{ $img }}')" />
    </div>
    {{ end }}
  {{ end }}
</section>
