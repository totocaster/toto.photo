<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    {{ partial "head.html" . }}
  </head>
  <body>
    <div class="layout">
      <section class="menu-column">{{ partial "nav" . }}</section>
      <button class="mobile-menu-toggle">Menu</button>
      <div class="mobile-menu-overlay">{{ partial "nav" . }}</div>
      <section class="content-area">{{ block "main" . }}{{ end }}</section>
    </div>
    
    <!-- Include lightbox just once for the entire site -->
    {{ partial "lightbox.html" . }}
  </body>
</html>
