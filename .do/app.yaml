name: totophoto
static_sites:
  - build_command: rm -r ./public; hugo --destination ./public
    environment_slug: hugo
    github:
      branch: main
      deploy_on_push: true
      repo: totocaster/toto.photo
    name: totophoto
    env:
      - key: HUGO_VERSION
        value: '0.139.0'
      - key: HUGO_EXTENDED
        value: '1'
